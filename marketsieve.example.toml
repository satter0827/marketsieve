# Copy to marketsieve.toml and keep credentials in the invoking environment only.
[source_profiles.japan]
currency = "JPY"
timezone = "Asia/Tokyo"

[source_profiles.japan.daily_bars]
plugin = "jquants"

[source_profiles.japan.daily_bars.settings]
timeout_seconds = 30

[source_profiles.japan.financials]
plugin = "jquants"

[source_profiles.japan.events]
plugin = "jquants"

[source_profiles.japan.events.settings]
# Add dividend only when the selected J-Quants plan permits the Premium endpoint.
event_types = "earnings"

[source_profiles.japan.instrument_universe]
plugin = "jquants"
operation = "fetch"

[source_profiles.us]
currency = "USD"
timezone = "America/New_York"

[source_profiles.us.daily_bars]
plugin = "alphavantage"

[source_profiles.us.daily_bars.settings]
plan = "free"
outputsize = "compact"

[source_profiles.us.financials]
plugin = "alphavantage"

[source_profiles.us.events]
plugin = "alphavantage"

[source_profiles.us.events.settings]
event_types = "earnings,dividend,split"

[source_profiles.us.instrument_universe]
plugin = "sec"
operation = "fetch"

[routines.jp]
source_profile = "japan"
lookback_days = 400
financial_lookback_days = 1500

[routines.us]
source_profile = "us"
lookback_days = 400
financial_lookback_days = 1500

[routines.weekly]
max_age_days = 7

[market]
indices = ["nikkei225", "topix500", "sp500", "dow30", "nasdaq100"]
history_days = 1095
batch_size = 50
profile_workers = 2
timeout_seconds = 30
max_retries = 3
retry_base_seconds = 2
minimum_overall_price_coverage = 0.95
minimum_index_price_coverage = 0.90

[research]
history_days = 3653
minimum_price_observations = 252
timeout_seconds = 30
max_retries = 3
retry_base_seconds = 2
