[project]
name = "marketsieve-app"
version = "0.1.0.dev0"
description = "Repository-local operational application for MarketSieve."
requires-python = ">=3.12,<3.15"
dependencies = [
    "click>=8.1,<9",
    "marketsieve",
    "rich>=14,<15",
]

[project.scripts]
marketsieve = "marketsieve_app.interfaces.cli:entrypoint"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/marketsieve_app"]

[tool.uv.sources]
marketsieve = { workspace = true }
