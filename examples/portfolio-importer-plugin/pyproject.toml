[project]
name = "marketsieve-example-portfolio"
version = "0.1.0"
description = "Minimal external portfolio importer plugin for MarketSieve."
requires-python = ">=3.12,<3.15"
dependencies = [
    "marketsieve>=0.11,<0.12",
    "marketsieve-extension-api>=0.11,<0.12",
]

[project.entry-points."marketsieve.portfolios.importers"]
example-portfolio = "marketsieve_example_portfolio:ExamplePortfolioImporter"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/marketsieve_example_portfolio"]
