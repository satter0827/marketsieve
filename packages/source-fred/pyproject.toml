[project]
name = "marketsieve-source-fred"
version = "0.11.0"
description = "FRED economic-series source for MarketSieve."
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "MarketSieve contributors" }]
dependencies = [
    "marketsieve>=0.11,<0.12",
    "marketsieve-extension-api>=0.11,<0.12",
]

[project.entry-points."marketsieve.sources"]
fred = "marketsieve_source_fred:FredSource"

[project.entry-points."marketsieve.sources.economic_series.fetchers"]
fred = "marketsieve_source_fred:FredSource"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/marketsieve_source_fred"]

[tool.hatch.build.targets.sdist]
only-include = ["LICENSE", "README.md", "pyproject.toml", "src"]

[tool.uv.sources]
marketsieve = { workspace = true }
marketsieve-extension-api = { workspace = true }
