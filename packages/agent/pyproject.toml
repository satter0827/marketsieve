[project]
name = "marketsieve-agent"
version = "0.2.0"
description = "Grounded explanation pipeline for MarketSieve."
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "MarketSieve contributors" },
]
dependencies = [
    "langchain-core>=1,<2",
    "langsmith>=0.3,<1",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/marketsieve_agent"]

[tool.hatch.build.targets.sdist]
only-include = [
    "LICENSE",
    "README.md",
    "pyproject.toml",
    "src",
]
