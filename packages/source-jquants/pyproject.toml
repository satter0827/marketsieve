[project]
name = "marketsieve-source-jquants"
version = "0.1.0"
description = "J-Quants API V2 source for MarketSieve."
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "MarketSieve contributors" }]
dependencies = [
    "marketsieve==0.1.0",
    "marketsieve-extension-api==0.1.0",
]

[project.entry-points."marketsieve.sources"]
jquants = "marketsieve_source_jquants:JQuantsSource"

[project.entry-points."marketsieve.sources.daily_bars.fetchers"]
jquants = "marketsieve_source_jquants:JQuantsSource"

[project.entry-points."marketsieve.sources.financials.fetchers"]
jquants = "marketsieve_source_jquants:JQuantsSource"

[project.entry-points."marketsieve.sources.events.fetchers"]
jquants = "marketsieve_source_jquants:JQuantsSource"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/marketsieve_source_jquants"]

[tool.hatch.build.targets.sdist]
only-include = ["LICENSE", "README.md", "pyproject.toml", "src"]

[tool.uv.sources]
marketsieve = { workspace = true }
marketsieve-extension-api = { workspace = true }
