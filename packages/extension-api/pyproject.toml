[project]
name = "marketsieve-extension-api"
version = "1.0.0rc3"
description = "Extension contracts for MarketSieve data sources."
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "MarketSieve contributors" },
]
keywords = ["market-data", "python", "stocks", "typing"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = [
    "marketsieve==1.0.0rc3",
]

[project.urls]
Homepage = "https://github.com/satter0827/marketsieve"
Documentation = "https://github.com/satter0827/marketsieve/blob/main/packages/extension-api/README.md"
Repository = "https://github.com/satter0827/marketsieve"
Issues = "https://github.com/satter0827/marketsieve/issues"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/marketsieve_extension_api"]

[tool.hatch.build.targets.sdist]
only-include = ["LICENSE", "README.md", "pyproject.toml", "src"]

[tool.uv.sources]
marketsieve = { workspace = true }
