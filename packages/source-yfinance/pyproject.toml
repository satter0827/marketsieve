[project]
name = "marketsieve-source-yfinance"
version = "1.0.0rc2"
description = "No-key yfinance equity batch source for MarketSieve."
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "MarketSieve contributors" }]
keywords = ["market-data", "python", "stocks", "yfinance"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = [
    "curl-cffi>=0.15,<1",
    "exchange-calendars>=4.11,<5",
    "marketsieve>=1.0.0rc2,<1.1",
    "marketsieve-extension-api>=1.0.0rc2,<1.1",
    "yfinance>=1.5.2,<2",
]

[project.urls]
Homepage = "https://github.com/satter0827/marketsieve"
Documentation = "https://github.com/satter0827/marketsieve/blob/main/packages/source-yfinance/README.md"
Repository = "https://github.com/satter0827/marketsieve"
Issues = "https://github.com/satter0827/marketsieve/issues"

[project.entry-points."marketsieve.sources.equity_batches.fetchers"]
yfinance = "marketsieve_source_yfinance:YFinanceSource"

[project.entry-points."marketsieve.sources.security_research.fetchers"]
yfinance = "marketsieve_source_yfinance:YFinanceSource"

[project.entry-points."marketsieve.sources.market_indicators.fetchers"]
yfinance = "marketsieve_source_yfinance:YFinanceSource"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/marketsieve_source_yfinance"]

[tool.hatch.build.targets.sdist]
only-include = ["LICENSE", "README.md", "pyproject.toml", "src"]

[tool.uv.sources]
marketsieve = { workspace = true }
marketsieve-extension-api = { workspace = true }
