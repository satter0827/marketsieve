[project]
name = "marketsieve-import-rakuten"
version = "0.10.0"
description = "Fixture-proven Rakuten Securities portfolio import for MarketSieve."
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "MarketSieve contributors" },
]
dependencies = [
    "marketsieve>=0.10,<0.11",
    "marketsieve-extension-api>=0.10,<0.11",
]

[project.entry-points."marketsieve.portfolios.importers"]
rakuten = "marketsieve_import_rakuten:RakutenPortfolioImporter"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/marketsieve_import_rakuten"]

[tool.hatch.build.targets.sdist]
only-include = ["LICENSE", "README.md", "pyproject.toml", "src"]

[tool.uv.sources]
marketsieve = { workspace = true }
marketsieve-extension-api = { workspace = true }
