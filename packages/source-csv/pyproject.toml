[project]
name = "marketsieve-source-csv"
version = "0.2.0"
description = "Manifest-backed CSV source for MarketSieve."
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "MarketSieve contributors" },
]
dependencies = [
    "marketsieve==0.2.0",
    "marketsieve-extension-api==0.2.0",
]

[project.entry-points."marketsieve.sources"]
csv = "marketsieve_source_csv:CsvDailyBarImporter"

[project.entry-points."marketsieve.sources.daily_bars.importers"]
csv = "marketsieve_source_csv:CsvDailyBarImporter"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/marketsieve_source_csv"]

[tool.hatch.build.targets.sdist]
only-include = ["LICENSE", "README.md", "pyproject.toml", "src"]

[tool.uv.sources]
marketsieve = { workspace = true }
marketsieve-extension-api = { workspace = true }
