[project]
name = "marketsieve-cli"
version = "1.0.0rc3"
description = "Public command-line workbench for MarketSieve."
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "MarketSieve contributors" },
]
keywords = ["market-analysis", "python", "stocks", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "click>=8.1,<9",
    "jsonschema>=4,<5",
    "marketsieve==1.0.0rc3",
    "marketsieve-extension-api==1.0.0rc3",
    "marketsieve-source-yfinance==1.0.0rc3",
    "rich>=14,<15",
]

[project.urls]
Homepage = "https://github.com/satter0827/marketsieve"
Documentation = "https://github.com/satter0827/marketsieve/blob/main/packages/cli/README.md"
Repository = "https://github.com/satter0827/marketsieve"
Issues = "https://github.com/satter0827/marketsieve/issues"

[project.scripts]
marketsieve = "marketsieve_cli.interfaces.cli:entrypoint"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/marketsieve_cli"]

[tool.hatch.build.targets.wheel.force-include]
"schemas" = "marketsieve_cli/schemas"

[tool.hatch.build.targets.sdist]
only-include = [
    "LICENSE",
    "README.md",
    "pyproject.toml",
    "schemas",
    "src",
]

[tool.uv.sources]
marketsieve = { workspace = true }
marketsieve-extension-api = { workspace = true }
marketsieve-source-yfinance = { workspace = true }
