[project]
name = "marketsieve-cli"
version = "0.8.0"
description = "Public command-line workbench for MarketSieve."
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "MarketSieve contributors" },
]
dependencies = [
    "click>=8.1,<9",
    "marketsieve>=0.8,<0.9",
    "marketsieve-extension-api>=0.8,<0.9",
    "rich>=14,<15",
]

[project.optional-dependencies]
all-sources = [
    "marketsieve-import-rakuten>=0.8,<0.9",
    "marketsieve-source-csv>=0.8,<0.9",
    "marketsieve-source-jquants>=0.8,<0.9",
    "marketsieve-source-alphavantage>=0.8,<0.9",
    "marketsieve-source-fred>=0.8,<0.9",
    "marketsieve-source-sec>=0.8,<0.9",
    "marketsieve-source-edinet>=0.8,<0.9",
]
all = [
    "marketsieve-import-rakuten>=0.8,<0.9",
    "marketsieve-source-csv>=0.8,<0.9",
    "marketsieve-source-jquants>=0.8,<0.9",
    "marketsieve-source-alphavantage>=0.8,<0.9",
    "marketsieve-source-fred>=0.8,<0.9",
    "marketsieve-source-sec>=0.8,<0.9",
    "marketsieve-source-edinet>=0.8,<0.9",
]

[project.scripts]
marketsieve = "marketsieve_cli.interfaces.cli:entrypoint"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/marketsieve_cli"]

[tool.hatch.build.targets.sdist]
only-include = [
    "LICENSE",
    "README.md",
    "pyproject.toml",
    "src",
]

[tool.uv.sources]
marketsieve = { workspace = true }
marketsieve-extension-api = { workspace = true }
marketsieve-import-rakuten = { workspace = true }
marketsieve-source-csv = { workspace = true }
marketsieve-source-jquants = { workspace = true }
marketsieve-source-alphavantage = { workspace = true }
marketsieve-source-fred = { workspace = true }
marketsieve-source-sec = { workspace = true }
marketsieve-source-edinet = { workspace = true }
