[project]
name = "marketsieve-cli"
version = "0.3.0"
description = "Public command-line workbench for MarketSieve."
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "MarketSieve contributors" },
]
dependencies = [
    "click>=8.1,<9",
    "marketsieve==0.3.0",
    "marketsieve-extension-api==0.3.0",
    "rich>=14,<15",
]

[project.optional-dependencies]
agent = [
    "marketsieve-agent==0.3.0",
]
all-sources = [
    "marketsieve-source-csv==0.3.0",
    "marketsieve-source-jquants==0.3.0",
    "marketsieve-source-alphavantage==0.3.0",
    "marketsieve-source-fred==0.3.0",
]
all = [
    "marketsieve-agent==0.3.0",
    "marketsieve-source-csv==0.3.0",
    "marketsieve-source-jquants==0.3.0",
    "marketsieve-source-alphavantage==0.3.0",
    "marketsieve-source-fred==0.3.0",
]

[project.scripts]
marketsieve = "marketsieve_cli.interfaces.cli:entrypoint"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/marketsieve_cli"]

[tool.hatch.build.targets.sdist]
only-include = [
    "LICENSE",
    "README.md",
    "pyproject.toml",
    "src",
]

[tool.uv.sources]
marketsieve-agent = { workspace = true }
marketsieve = { workspace = true }
marketsieve-extension-api = { workspace = true }
marketsieve-source-csv = { workspace = true }
marketsieve-source-jquants = { workspace = true }
marketsieve-source-alphavantage = { workspace = true }
marketsieve-source-fred = { workspace = true }
