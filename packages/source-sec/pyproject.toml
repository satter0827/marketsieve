[project]
name = "marketsieve-source-sec"
version = "0.3.0"
description = "SEC EDGAR filing and financial-fact source for MarketSieve."
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "MarketSieve contributors" }]
dependencies = [
    "marketsieve==0.3.0",
    "marketsieve-extension-api==0.3.0",
]

[project.entry-points."marketsieve.sources"]
sec = "marketsieve_source_sec:SecSource"

[project.entry-points."marketsieve.sources.financials.fetchers"]
sec = "marketsieve_source_sec:SecSource"

[project.entry-points."marketsieve.sources.instrument_universe.fetchers"]
sec = "marketsieve_source_sec:SecSource"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/marketsieve_source_sec"]

[tool.hatch.build.targets.sdist]
only-include = ["LICENSE", "README.md", "pyproject.toml", "src"]

[tool.uv.sources]
marketsieve = { workspace = true }
marketsieve-extension-api = { workspace = true }
