[project]
name = "marketsieve"
version = "0.9.0"
description = "A typed Python SDK for reproducible market analysis."
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "MarketSieve contributors" },
]
keywords = [
    "market-analysis",
    "python",
    "stocks",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = [
    "tzdata>=2025.2",
]

[project.urls]
Homepage = "https://github.com/satter0827/marketsieve"
Documentation = "https://github.com/satter0827/marketsieve/blob/main/docs/README.md"
Repository = "https://github.com/satter0827/marketsieve"
Issues = "https://github.com/satter0827/marketsieve/issues"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/marketsieve"]

[tool.hatch.build.targets.sdist]
only-include = [
    "LICENSE",
    "README.md",
    "pyproject.toml",
    "src",
]
