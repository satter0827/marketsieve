name: Publish verified GitHub release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing vX.Y.Z or vX.Y.ZrcN tag on the verified main commit
        required: true
        type: string
      ci_run_id:
        description: Successful main push CI run that built the release artifact
        required: true
        type: string

permissions:
  actions: read
  contents: write

concurrency:
  group: publish-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish verified artifacts
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag }}
      - name: Verify tag and source CI run
        id: provenance
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          CI_RUN_ID: ${{ inputs.ci_run_id }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(rc[1-9][0-9]*)?$ ]]
          [[ "$CI_RUN_ID" =~ ^[0-9]+$ ]]
          commit="$(git rev-list -n 1 "$TAG")"
          test "$commit" = "$(git rev-parse HEAD)"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${CI_RUN_ID}" --jq .event)" = push
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${CI_RUN_ID}" --jq .head_branch)" = main
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${CI_RUN_ID}" --jq .head_sha)" = "$commit"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${CI_RUN_ID}" --jq .conclusion)" = success
          git fetch origin main
          git merge-base --is-ancestor "$commit" origin/main
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-${{ steps.provenance.outputs.commit }}
          path: release
          run-id: ${{ inputs.ci_run_id }}
          github-token: ${{ github.token }}
      - name: Verify the build-once artifacts
        run: >-
          python3 -m scripts.release_gate verify
          --version "${{ steps.provenance.outputs.version }}"
          --commit "${{ steps.provenance.outputs.commit }}"
          --dist-dir release
      - name: Create a recoverable draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" --json isDraft --jq .isDraft > draft-state; then
            test "$(<draft-state)" = true
            gh release upload "$TAG" release/* --clobber
          else
            prerelease=()
            [[ "$TAG" == *rc* ]] && prerelease=(--prerelease)
            gh release create "$TAG" release/* \
              --draft --verify-tag --generate-notes --title "MarketSieve $TAG" \
              "${prerelease[@]}"
          fi
      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: gh release edit "$TAG" --draft=false
