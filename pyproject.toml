[project]
name = "marketsieve-workspace"
version = "0.0.0"
requires-python = ">=3.12,<3.15"
dependencies = [
    "marketsieve-app",
]

[dependency-groups]
dev = [
    "build>=1.2,<2",
    "hatchling>=1.27,<2",
    "mypy>=1.14,<2",
    "pytest>=8.3,<10",
    "ruff>=0.9,<1",
    "twine>=6,<7",
]

[tool.uv]
package = false
required-version = ">=0.12,<0.13"

[tool.uv.workspace]
members = [
    "apps/marketsieve",
    "packages/core",
]

[tool.uv.sources]
marketsieve-app = { workspace = true }

[tool.pytest.ini_options]
addopts = "-q --strict-config --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = [
    "apps/marketsieve/src",
    "packages/core/src",
    "scripts",
    "tests",
]
target-version = "py312"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "SIM", "UP"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
files = [
    "apps/marketsieve/src",
    "packages/core/src",
    "scripts",
    "tests",
]
python_version = "3.12"
strict = true
warn_unused_ignores = true
