[project]
name = "marketsieve-workspace"
version = "0.0.0"
requires-python = ">=3.12,<3.15"
dependencies = [
    "marketsieve-app",
]

[dependency-groups]
dev = [
    "build>=1.2,<2",
    "coverage[toml]>=7,<8",
    "hatchling>=1.27,<2",
    "import-linter>=2,<3",
    "jsonschema>=4,<5",
    "mypy>=1.14,<2",
    "pytest>=8.3,<10",
    "ruff>=0.9,<1",
    "twine>=6,<7",
    "types-jsonschema>=4,<5",
]

[tool.uv]
package = false
required-version = ">=0.12,<0.13"

[tool.uv.workspace]
members = [
    "apps/marketsieve",
    "packages/core",
]

[tool.uv.sources]
marketsieve-app = { workspace = true }

[tool.pytest.ini_options]
addopts = "-q --strict-config --strict-markers"
cache_dir = ".marketsieve/cache/pytest"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
cache-dir = ".marketsieve/cache/ruff"
line-length = 100
src = [
    "apps/marketsieve/src",
    "packages/core/src",
    "scripts",
    "tests",
]
target-version = "py312"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "SIM", "UP"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
cache_dir = ".marketsieve/cache/mypy"
files = [
    "apps/marketsieve/src",
    "packages/core/src",
    "scripts",
    "tests",
]
python_version = "3.12"
strict = true
warn_unused_ignores = true

[tool.coverage.run]
branch = true
data_file = ".marketsieve/coverage/data"
source = ["marketsieve", "marketsieve_app"]
omit = ["*/marketsieve_app/__main__.py"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true

[tool.coverage.json]
output = ".marketsieve/coverage/coverage.json"

[tool.importlinter]
root_packages = ["marketsieve", "marketsieve_app"]

[[tool.importlinter.contracts]]
name = "Application dependencies point inward"
type = "layers"
layers = [
    "marketsieve_app.interfaces",
    "marketsieve_app.bootstrap",
    "marketsieve_app.application",
    "marketsieve",
]

[[tool.importlinter.contracts]]
name = "CLI depends on the composition root only"
type = "forbidden"
source_modules = ["marketsieve_app.interfaces"]
forbidden_modules = ["marketsieve_app.application", "marketsieve"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Public SDK does not depend on the repository application"
type = "forbidden"
source_modules = ["marketsieve"]
forbidden_modules = ["marketsieve_app"]
