[project]
name = "marketsieve-workspace"
version = "0.0.0"
requires-python = ">=3.12,<3.15"
dependencies = [
    "marketsieve-cli",
    "marketsieve-source-yfinance",
]

[dependency-groups]
dev = [
    "build>=1.2,<2",
    "coverage[toml]>=7,<8",
    "hatchling>=1.27,<2",
    "import-linter>=2,<3",
    "jsonschema>=4,<5",
    "mypy>=1.14,<2",
    "pytest>=8.3,<10",
    "pytest-cov>=7,<8",
    "ruff>=0.9,<1",
    "twine>=6,<7",
    "types-jsonschema>=4,<5",
]

[tool.uv]
package = false
required-version = ">=0.12,<0.13"

[tool.uv.workspace]
members = [
    "packages/cli",
    "packages/core",
    "packages/extension-api",
    "packages/source-yfinance",
]

[tool.uv.sources]
marketsieve-cli = { workspace = true }
marketsieve-source-yfinance = { workspace = true }

[[tool.marketsieve.public-packages]]
distribution = "marketsieve"
path = "packages/core"
module = "marketsieve"
role = "sdk"

[[tool.marketsieve.public-packages]]
distribution = "marketsieve-extension-api"
path = "packages/extension-api"
module = "marketsieve_extension_api"
role = "extension-api"

[[tool.marketsieve.public-packages]]
distribution = "marketsieve-cli"
path = "packages/cli"
module = "marketsieve_cli"
role = "cli"

[[tool.marketsieve.public-packages]]
distribution = "marketsieve-source-yfinance"
path = "packages/source-yfinance"
module = "marketsieve_source_yfinance"
role = "adapter"

[tool.pytest.ini_options]
addopts = "-q --strict-config --strict-markers"
cache_dir = ".marketsieve/cache/pytest"
pythonpath = ["."]
testpaths = ["tests"]
markers = ["live: explicit provider smoke tests disabled by default"]

[tool.ruff]
cache-dir = ".marketsieve/cache/ruff"
line-length = 100
src = [
    "packages/cli/src",
    "packages/core/src",
    "packages/extension-api/src",
    "packages/source-yfinance/src",
    "scripts",
    "tests",
]
target-version = "py312"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "SIM", "UP"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
cache_dir = ".marketsieve/cache/mypy"
files = [
    "packages/cli/src",
    "packages/core/src",
    "packages/extension-api/src",
    "packages/source-yfinance/src",
    "scripts",
    "tests",
]
python_version = "3.12"
strict = true
warn_unused_ignores = true

[tool.coverage.run]
branch = true
data_file = ".marketsieve/coverage/data"
source = ["marketsieve", "marketsieve_cli", "marketsieve_extension_api", "marketsieve_source_yfinance"]
omit = ["*/marketsieve_cli/__main__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.coverage.json]
output = ".marketsieve/coverage/coverage.json"

[tool.importlinter]
root_packages = ["marketsieve", "marketsieve_cli", "marketsieve_extension_api", "marketsieve_source_yfinance"]

[[tool.importlinter.contracts]]
name = "Application dependencies point inward"
type = "layers"
layers = [
    "marketsieve_cli.interfaces",
    "marketsieve_cli.bootstrap",
    "marketsieve_cli.adapters",
    "marketsieve_cli.application",
    "marketsieve_source_yfinance",
    "marketsieve_extension_api",
    "marketsieve",
]

[[tool.importlinter.contracts]]
name = "CLI depends on the composition root only"
type = "forbidden"
source_modules = ["marketsieve_cli.interfaces"]
forbidden_modules = ["marketsieve_cli.application", "marketsieve"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Public SDK does not depend on the repository application"
type = "forbidden"
source_modules = ["marketsieve"]
forbidden_modules = ["marketsieve_cli"]

[[tool.importlinter.contracts]]
name = "Extension API is independent from implementations"
type = "forbidden"
source_modules = ["marketsieve_extension_api"]
forbidden_modules = ["marketsieve_cli", "marketsieve_source_yfinance"]

[[tool.importlinter.contracts]]
name = "yfinance source does not depend on the CLI"
type = "forbidden"
source_modules = ["marketsieve_source_yfinance"]
forbidden_modules = ["marketsieve_cli"]
